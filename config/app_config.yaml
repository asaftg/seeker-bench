# ───────────────────────────────────────────────────────────
# Seeker-01 Bench Test — Application Config
# ───────────────────────────────────────────────────────────
# Every tunable lives here. Code modules should never hardcode
# thresholds or paths; they read from this file via common.config.
# Changing a value here and restarting the app should be enough.

thermal:
  # Software extrinsic calibration vs. EO (ground truth). Applied to
  # thermal detections' angular pose inside FusionManager before cross-
  # sensor association so the fused/projected thermal bbox lines up on
  # the EO panel. Live-tunable from the DEV-tab EXTRINSIC CALIBRATION
  # sliders. Zero = thermal boresight perfectly co-aligned with EO.
  extrinsic:
    az_bias_deg: 0.0
    el_bias_deg: 0.0

  # Camera
  device_index: auto            # auto | 0 | 1 | 2 | 3
  resolution: [640, 512]        # FLIR Boson 640
  mode: RAW16                   # RAW16 (Y16) | AGC8 (YUY2)
  target_fps: 60

  # FOV (FLIR ADK 40640U075 is 75°H × ~60°V)
  hfov_deg: 75.0
  vfov_deg: 60.0

  # AGC
  #
  # 2026-04-27: full revert to the pre-2026-04-27 baseline at operator
  # request. Multiple tuning passes (CLAHE, gamma, bilateral, unsharp,
  # WHITE_HOT, lanczos4) all looked WORSE on the live bench scene than
  # the original 2/98 + INFERNO + bilinear. The new processing
  # primitives remain in thermal/thermal_processor.py and are
  # YAML-reachable via an `enhance:` block + `agc.clahe:` + `agc.colormap`
  # + `digital_zoom.interpolation` if a future operator wants them, but
  # NONE are on by default — defaults reproduce the legacy pipeline
  # bit-for-bit. The Y16 negotiation-order fix in boson_capture.py is
  # kept (it's a real bug, unrelated to image processing).
  agc:
    low_percentile: 2
    high_percentile: 98
    colormap: WHITE_HOT         # INFERNO | IRONBOW | WHITE_HOT | JET | MAGMA — operator preference 2026-04-27

  # Digital zoom presets (emulated narrow FOV)
  digital_zoom:
    enabled: true
    preset: full                # full | wide | mid | narrow | tight
    presets:
      full:   { hfov_deg: 75.0 }
      wide:   { hfov_deg: 37.5 }
      mid:    { hfov_deg: 18.75 }
      narrow: { hfov_deg: 12.5 }

heat_detector:
  # residual = frame - spatial_mean(frame)
  # threshold = median(residual) + k * 1.4826 * MAD(residual)
  # Defaults tuned for an INDOOR 8-bit AGC'd scene — raise threshold_k
  # or lower min_blob_area_px once you're pointing at sky backgrounds.
  threshold_k: 20.0             # lower = more sensitive (x MAD). Default = minimum sensitivity; tune up via the DEV tab.
  background_kernel: 31         # spatial background kernel (odd)
  min_blob_area_px: 500         # very conservative; slider in DEV tab drops it to ~3 for max sensitivity
  max_blob_area_px: 30000       # allow large targets (hot cup at narrow zoom)
  max_detections_per_frame: 6
  algorithm: tophat
  tophat_kernel: 31             # max target diameter in pixels (odd; bigger = catches larger objects)

  # Temporal tracker — suppresses flicker, smooths bboxes.
  # A blob must survive `min_hits` frames before a box is drawn;
  # a confirmed blob survives up to `max_misses` frames of missing
  # detections before being dropped.
  tracker:
    # This is the *heat-blob* tracker (classical CV), not the H/V one —
    # the H/V classifier runs its own ByteTrack now. Heat blobs still
    # use hand-rolled greedy IoU because they're small, noisy, and
    # appear/disappear rapidly (not a good fit for Kalman priors).
    enabled: true
    max_dist_px: 40             # max centroid distance (px) to match across frames
    min_hits: 5                 # consecutive frames before a box is shown
    max_misses: 5               # grace frames after a track stops matching
    ema: 0.5                    # bbox smoothing: 0 = raw, 1 = frozen

classifier:
  enabled: true
  model_path: models/yolov8n.pt
  trained_model_path: models/seeker_thermal.pt   # preferred if exists
  conf_threshold: 0.40          # higher = fewer false DRONE labels; lower = catches faint drones
  classify_interval_frames: auto  # auto | int. auto = 1 on GPU, 6 on CPU (~5Hz on laptop).
  roi_padding_px: 16
  # Model class-index → TargetClass mapping.
  # For the fine-tuned seeker_thermal.pt trained on thermal drone
  # data: class 0 = drone. Stock COCO weights are not loaded.
  class_to_target:
    0: drone

  # ── Phase B — Human + Vehicle classifier (Ticket 1) ─────────────────────
  # Set classifier_hv_enabled: true after running:
  #   python scripts/train_yolo_hv.py --auto
  # to produce models/seeker_thermal_hv.pt.
  # Until that model exists the h/v classifier falls back to stock yolov8n.pt
  # (COCO person/car/truck/bus classes) — still useful, just less accurate on
  # thermal imagery than a fine-tuned model.
  classifier_hv_enabled: true
  classifier_hv_model: models/seeker_thermal_hv.pt
  classifier_hv_conf: 0.55           # higher = fewer FPs on warm chips/ceiling lights
  classifier_hv_classes: [person, vehicle]
  # Reject tiny h/v detections — a real person/car at bench range is
  # much bigger than a hand-sized warm patch. Tune up if too conservative.
  classifier_hv_min_bbox_px: 2500    # ~50x50 minimum area
  # Temporal persistence: a h/v box must survive this many classifier
  # runs at IoU >= 0.3 before it's drawn. Kills single-frame flicker FPs.
  # ByteTrack owns persistence now, so these knobs are mostly defanged;
  # the merge code still reads min_hits but ByteTrack-confirmed tracks
  # arrive pre-confirmed so min_hits=1 is effectively the operative value.
  classifier_hv_min_hits: 2
  classifier_hv_max_misses: 8        # unused with ByteTrack; kept for config compat
  classifier_hv_bbox_ema: 0.15       # bbox smoothing: 0 = raw YOLO, 0.5 = heavy lag. Low = snappy.
  # Inference image size. auto = 960 on GPU (boosts detection range for
  # distant/small targets), 640 on CPU. Int override allowed.
  classifier_hv_imgsz: auto

eo:
  # Electro-optical pipeline — Leopard LI-USB30-IMX568-GMSL2 (mono, global
  # shutter, 2472×2064 @ 2.74µm → 6.77×5.65mm sensor) + Commonlands
  # CIL350-F2.4-M12ANIR (35mm EFL, F/2.4, NIR). Yields ~11.05° HFOV,
  # ~9.23° VFOV — narrow telephoto, ~7x finer per-pixel IFOV than thermal.
  enabled: true
  # Capture backend:
  #   imx568 — real hardware via DirectShow at 2472×2064 (mono, AGC'd in sw)
  #   webcam — generic UVC webcam fallback for dev on laptops without the kit
  sensor: imx568                # imx568 | webcam
  device_index: auto            # auto | 0 | 1 | 2 ...
  skip_builtin_webcam: false    # webcam-mode only: skip index 0 if it's a built-in
  target_fps: 20                # IMX568 over USB3 sustains ~19 fps at full res
  # SDK stream cadence (only used in sensor=imx568 mode). The SDK helper
  # actively throttles delivered frames to this rate. 10 was the historical
  # default (chosen for power); 20 doubles motion smoothness on moving
  # vehicles with no measured downside. Cap at 25 — beyond that we start
  # competing with the FX3 USB3 bus saturation under RAW12.
  stream_fps: 20.0
  # Resolution is ignored when sensor=imx568 (native 2472×2064 is forced).
  resolution: [1920, 1080]      # webcam mode: will negotiate closest supported

  # Downscale the 2472×2064 native capture to this width BEFORE AGC, YOLO,
  # and JPEG encoding. Height is auto-scaled to preserve aspect.
  #
  # Trade-off: bigger = sharper EO panel + more YOLO recall on small
  # targets, but QUADRATIC cost in AGC / encode / WS bandwidth.
  # Don't bump this above 1236 without checking fps — going to 1854 was
  # tried 2026-04-24 and dropped the EO publish rate from 14 → 6 Hz on
  # this laptop, which felt much worse than the marginal sharpness win.
  # The browser canvas is ~640 px wide on the MAIN tab anyway, so almost
  # all the extra source pixels get thrown away by the client. The real
  # leverage for sharpness is JPEG quality (gui.eo_jpeg_quality), not
  # source resolution. Set to 0 to disable downscaling entirely.
  display_max_width: 1236

  # Exposure profiles — auto-selected from scene brightness, hysteretic.
  # SAVgood 850nm VCSEL illuminator is manually controlled by the operator
  # (always-on, switched at the device). Night profile assumes illuminator
  # fill, so gain+exposure are pushed harder than an unilluminated scene
  # could tolerate without motion smear.
  profiles:
    # Bright outdoor / lit room — short exposure, low gain.
    # 0.5ms is aggressive: on a 30fps / 33ms frame budget this is still
    # sky-safe and keeps high-contrast scenes (roof edge against bright
    # sky) from clipping. If the bridge rejects sub-ms exposures we'll
    # see in the log and bump this back up.
    day:
      exposure_ms: 0.5
      gain: 1.0
      # Enter DAY when scene mean (0..255) crosses above this from DUSK
      enter_above: 150.0
      enter_below: 255.0
    # Indoor normal / overcast twilight
    dusk:
      exposure_ms: 20.0
      gain: 4.0
      enter_above: 50.0
      enter_below: 160.0
    # Dark scene, VCSEL fills NIR
    night:
      exposure_ms: 80.0
      gain: 16.0
      enter_above: 0.0
      enter_below: 60.0
  profile_min_dwell_s: 3.0      # min seconds before another profile switch

  # Actually drive the sensor's exposure + gain from the profile selector.
  #
  # FALSE (default): the FX3 bridge runs its own auto-exposure. The
  #   camera adapts to whatever the scene is — bright outdoor, indoor
  #   bench, dim corner — without us locking it to one of three guesses.
  #   This is the setting that produced a watchable image historically.
  #
  # TRUE: we flip the camera to MANUAL mode and command the current
  #   profile's exposure_ms / gain. Sounds nice in theory but in
  #   practice it: (a) the FX3 firmware silently ignores exposure
  #   writes on this bridge, AND (b) the manual-mode flip itself sticks
  #   even though the value doesn't, so the camera locks at some default
  #   manual-exposure value with no AE — the displayed image goes dark
  #   indoors and "looks like shit" outdoors. Flip on ONLY after a
  #   bridge firmware update where exposure writes verifiably take.
  #
  # Either way the AGC + enhancement chain handles display dynamic range,
  # so the visible image is never raw bridge output.
  profile_control_exposure: false

  # Bridge auto-exposure lock. Set this to a UVC log2(seconds) value to
  # write CAP_PROP_AUTO_EXPOSURE=manual + CAP_PROP_EXPOSURE on the FX3
  # bridge via cv2-DSHOW before PyAV opens the device. Killing bridge AE
  # was the single biggest "static scene stops breathing frame to frame"
  # win on this rig (2026-04-24). The bridge wanders between exposure
  # values on every frame even when nothing in the scene moves.
  #
  # Conversion: -6 ≈ 1/64 s ≈ 16 ms, -7 ≈ 8 ms, -5 ≈ 32 ms, -4 ≈ 64 ms.
  # Tune to match the brightness/mood of Leopard CameraTool's reference.
  # Set to null to disable (bridge AE runs free).
  manual_exposure_log2: null    # legacy UVC path — bridge ignores it on FX3
  # Optional gain lock (CAP_PROP_GAIN). Bridge-specific scale; null=skip.
  manual_gain: null
  # PRIMARY exposure lock on the IMX568/FX3 rig. Sends LPCamera.ExposureExt
  # via the 32-bit Leopard SDK helper before PyAV opens the device. The
  # FX3 firmware ignores all standard UVC writes (proven in
  # scripts/eo_probe_uvc_props.py) but DOES honor ExposureExt — it's the
  # vendor extension Leopard's CameraTool uses. With manual_exposure_ext
  # set, the static-scene "breathing" the user observed disappears
  # (mean span 1.7 over 30s vs full-saturation drift before).
  # Set to null to skip the SDK prelude entirely.
  #
  # NEW DEFAULT (2026-04-24): null → bridge runs its own auto-exposure
  # via the SDK stream. With `eo.sensor: imx568` and `manual_exposure_ext:
  # null`, IMX568Capture spawns the SDK helper with `--ae on` and lets
  # the FX3/IMX568 firmware adapt exposure to the scene the same way
  # CameraTool does on its default settings. This is what you want for
  # "I'm pointing the bench at an arbitrary scene tomorrow and don't
  # want to wake up to a blown-out white frame."
  #
  # Set this to a specific int (e.g. 1264 or 2000) to LOCK exposure for
  # repeatable engineering tests / reference-comparison runs:
  #   1264  reproduces leopard_reference.bmp at sub-decimal precision
  #         (R/G/B mean = 16/17/15 raw — dim but stable)
  #   2000  the calibrated value that produced the verified frame-to-
  #         frame match against leopard_reference.bmp
  # The GUI dev tab also exposes a toggle to flip this at runtime.
  manual_exposure_ext: null

  # Software auto-exposure (Auto mode driver).
  #
  # The FX3 bridge's own AE is broken on this rig in bright daylight
  # (verified 2026-04-25 with scripts/sdk_daylight_diagnostic.py): it
  # leaves the IMX568 fully analog-clipped through the 35mm NIR-pass
  # lens and never recovers. Even Leopard's CameraTool produces a pure
  # white frame in those conditions. So when the user is in "Auto" mode
  # (manual_exposure_ext: null), this software AE thread polls raw u16
  # stats from the SDK stream and drives ExposureExt itself, using a
  # bracket-based binary search controller.
  #
  # Validated: converged 1264 -> 9 in 8 iterations on a saturated cloudy
  # daylight scene (scripts/sdk_ae_loop.py).
  #
  # Manual mode (manual_exposure_ext: <int>) takes priority — software
  # AE no-ops while the user is overriding.
  auto_exposure:
    enabled: true
    target_p99_lo: 300.0    # raw u16; well above noise floor
    target_p99_hi: 3500.0   # raw u16; comfortably below 4095 ceiling
    initial_exposure_ext: 1264   # historical reference seed
    step_period_s: 1.5      # how often the AE thread evaluates
    reengage_frac_clip: 0.05  # only re-engage on catastrophic clip
    max_blank_iters: 6      # consecutive blank stats before warning

  # Percentile AGC on luma channel (mono sensor, BGR output has identical
  # channels from DirectShow's YUY2 decode). Stretches low_percentile..
  # high_percentile across 0..255 before publishing so YOLO + display see
  # a consistent image regardless of current exposure.
  #
  # Tight bands like [2, 98] hard-clip ~4% of pixels to pure black/white,
  # which on a sunlit outdoor scene gives a posterized "HDR-torture" look
  # — what should be a smooth B&W image gets crushed shadows and blown
  # highlights. [0.5, 99.5] only clips genuine outliers (hot pixels,
  # sun-disk, sensor noise spikes) so the panel looks like a normal
  # mono photo instead of a contrast-pumped render.
  # AGC + enhancement: OFF by default.
  #
  # We tried "do clever processing on the 8-bit-from-12-bit FX3 output"
  # — percentile AGC + gamma + CLAHE + unsharp — and on a low-light
  # 7 pm indoor frame it turned grain into "oil-painting" ridge
  # artifacts. The bridge already runs its own auto-exposure
  # (profile_control_exposure: false); the simplest, most honest
  # answer is to TRUST that AE and pass the frame through. This is
  # also what every consumer webcam app does — no AGC, no gamma,
  # no CLAHE, just whatever the sensor gave us.
  #
  # The processing chain remains code-available and YAML-toggleable
  # for daylight scenes that benefit from it. To enable:
  #   * set agc.enabled: true              ← turn the chain on at all
  #   * set enhance.gamma: 0.85            ← mild midtone lift
  #   * set enhance.clahe.enabled: true    ← local contrast (DAYLIGHT ONLY!)
  #   * set enhance.unsharp.enabled: true  ← extra sharpness on clean frames
  #
  # In low light, EVERY stage past percentile clip will amplify noise.
  # Don't touch them on a noisy scene; fix exposure first.
  agc:
    # OFF — passthrough, like Leopard CameraTool does. Per-frame
    # percentile AGC was enabled briefly and produced the exact symptoms
    # the user reported: "granular, noisy, breathing." All three were
    # the AGC's fault:
    #   * granular/noisy: stretching a raw-mean-~16 frame to 0..255 is
    #     a 6× multiplication of sensor noise.
    #   * breathing: the [0.5, 99.5] thresholds drift fractionally with
    #     noise frame-to-frame; after the 6× stretch that drift becomes
    #     visible brightness wobble.
    # CameraTool just displays the raw 8-bit frame as-is. Doing the
    # same here gets Leopard-quality output. If we ever want the frame
    # brighter than Leopard without breathing, use a *fixed* gain
    # (constant multiplier, NOT percentile-based) — see eo_processor.
    enabled: false
    low_percentile:  0.5
    high_percentile: 99.5

  enhance:
    # Median 3×3 — fast salt-and-pepper denoise. Cheap (~1 ms), edge-
    # preserving. Off by default since we're in passthrough; enable
    # together with agc.enabled to clean the input before stretching.
    denoise:
      enabled: false
      ksize: 3
    # Midtone lift. 1.0 = no change. 0.85 = mild lift (good for daylight).
    # Set to 1.0 (or omit) to disable.
    gamma: 1.0
    # Local contrast. Off by default — amplifies noise on low-light input.
    # Re-enable only on clean daylight frames; clip_limit 1.0–1.5 is safe.
    clahe:
      enabled: false
      clip_limit: 1.5
      tile_grid: 8
    # Edge sharpening. Off by default — same reason as CLAHE.
    unsharp:
      enabled: false
      amount: 0.4
      radius: 1.0

  # Optics. IMX568 + Commonlands CIL350 35mm is 11.05° H × 9.23° V.
  # If you're running a test webcam instead of the real sensor, set
  # `test_webcam` below and these get overridden at startup. Don't edit
  # these two lines directly — they describe the real mission hardware.
  hfov_deg: 11.05
  vfov_deg: 9.23

  # Test mode: when running with a generic webcam in place of the real
  # IMX568 + 35mm lens, we need to tell fusion the *actual* FOV the
  # webcam sees — otherwise cross-sensor angular matching is broken.
  # Pick the profile matching your webcam (or add one). `none` uses the
  # real-hardware optics above.
  test_webcam: none                # none | insta360_link | logitech_c920 | generic_60
                                   # (real IMX568 hardware — leave as 'none')
  test_webcam_profiles:
    none:            { hfov_deg: null, vfov_deg: null }
    insta360_link:   { hfov_deg: 67.0, vfov_deg: 41.0 }   # CINSABNB, 79.5° DFOV @ 16:9
    logitech_c920:   { hfov_deg: 70.4, vfov_deg: 43.3 }   # 78° DFOV @ 16:9
    generic_60:      { hfov_deg: 60.0, vfov_deg: 36.9 }   # typical laptop cam

  classifier:
    enabled: true
    # EO currently forces COCO fallback (person/car/truck/bus/motorcycle)
    # until a dedicated EO model exists. TODO: train EO drone detector.
    model: models/yolov8n.pt
    conf_threshold: 0.45
    classes: [person, vehicle]
    include_drone: false        # TODO: enable after EO drone fine-tune
    # imgsz: 832 matches the resolution seeker_eo_v3.pt was trained at
    # (see thermal/training/train_eo_v3_close_targets.py docstring).
    # Was 1280 — that ran ~2.4x slower than 832 AND mismatched the
    # training distribution by 1.54x, causing a measured publish-rate
    # bottleneck at ~12 Hz (operator-reported lag 2026-04-25). At 832
    # we expect ~18-20 Hz publish, with no recall regression because
    # 832 IS the model's native input size.
    # Drop to 640 on weak GPUs; bump back to 1280 only if a future
    # model is retrained at that resolution.
    imgsz: 832
    # Run YOLO every 2nd frame on GPU (tracks coast in between, no
    # flicker) so publish rate roughly doubles. "auto" = 2 GPU / 4 CPU.
    classify_interval_frames: auto
    min_bbox_px: 1500
    # ByteTrack (ultralytics model.track) owns persistence on the EO
    # side now. These knobs are unused but kept for config compat; tune
    # ByteTrack itself via its yaml if needed (see Future Work in README).
    min_hits: 2
    max_misses: 8
    bbox_ema: 0.2

radar:
  # AWR2944P EVM, firmware: mmw_demoDDM (Doppler-Division MIMO, SDK 4.7.2.1).
  # See docs/radar_setup.md for setup + flashing details.
  #
  # *Two* USB cables to the EVM:
  #   J10 (FTDI_USB, left)   → COM6-9  — auxiliary FTDI UARTs, unused by us
  #   J8  (XDS_USB,  right)  → COM10/11 — XDS110 virtual UARTs, WHICH WE USE
  # MSS_UARTA (CLI/SBL) is routed only to the XDS110, not the FTDI. The
  # flashing-mode SBL ROM and the functional-mode mmw_demoDDM CLI both live
  # on COM11; the data UART (TLV stream) is on COM10 at 3_125_000 baud.
  #
  # Stock DDM firmware on AWR2944P emits detected-points + side-info TLVs
  # only; targets are clustered client-side by radar.radar_manager (TI's
  # Group Tracker is NOT compiled into this build of mmw_demoDDM).
  enabled: true
  cli_port: COM11               # CLI UART (115200), pushes .cfg here
  data_port: COM10              # data UART (3_125_000), TLV stream comes in here
  cli_baud: 115200
  data_baud: 3125000            # verified by brute-forcing bauds until magic word aligned
  cfg_path: "C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr2x44P/mmw_ddm/profiles/awr2944P/profile_3d_3Azim_1ElevTx_DDMA_awr2944P_highRange.cfg"
  profile_name: awr2944p_ddm
  snr_min_db: 6.0               # lower = more returns. Sparse-vehicle clouds were being gated out at 12 dB.
  # Project objective is long-range detection. The highRange .cfg's
  # profileCfg (slope 8.883 MHz/µs, ADC 30 MHz) supports ~250 m max
  # unambiguous range — we pin max_range_m to the full capability.
  # If you ever need further: author a new .cfg with a shallower slope.
  max_range_m: 250.0
  # Narrow the useful azimuth window — the AWR2944P antenna has lobes
  # well off-boresight but most of that energy is sidelobe clutter at
  # long range. Gating to ±az_half_deg concentrates the displayed point
  # cloud into the main lobe, where SNR per target is highest and the
  # remaining points are the ones worth clustering.
  az_half_deg: 60.0
  # Speed filter — drop points whose radial velocity (|doppler|) is
  # below this threshold. 0.0 = off (show static returns too). Set
  # above ~0.3 m/s to suppress walls / trees / parked cars and leave
  # only movers, which is usually what you want for drone / vehicle
  # watch. Applied BEFORE DBSCAN so static points don't pad clusters.
  speed_min_mps: 0.4
  # Near-range blanking — drop points (and hence any clusters) closer
  # than this. Useful when the sensor mount, tripod, vehicle hood, or
  # your own body are generating fat reflections right on top of the
  # radar. 0.0 = off.
  range_min_m: 0.0
  # Software extrinsic calibration vs. EO (ground truth). Tunable live
  # from the DEV-tab EXTRINSIC CALIBRATION sliders. Zero = radar boresight
  # perfectly co-aligned with EO. Use to nudge the projected radar bbox
  # on the EO/thermal panels until it overlaps the detected target.
  extrinsic:
    az_bias_deg: 0.0   # + = radar reads too far left; subtract bias to shift right
    el_bias_deg: 0.0   # + = radar reads too low; subtract to shift up
  # DBSCAN tuning — loose defaults so sparse vehicle returns still cluster.
  # Larger eps_pos_m stitches a thin scatter into a single box; min_samples
  # 3 lets a 3-point vehicle return form a box while still rejecting
  # singletons that would flicker the display.
  cluster_eps_pos_m: 8.0
  cluster_eps_dop_mps: 3.0
  # Min-samples 2 lets a distant sparse human (often just 2 returns) form
  # a box. Singleton noise is still rejected by DBSCAN (a lone point
  # needs ≥2 neighbours to be a core point); frame-to-frame M-of-N
  # confirmation below kills the rare 2-point coincidence false positive.
  cluster_min_samples: 2

  # Kalman tracker — stabilises bboxes through flicker and brief dropouts.
  # The clusterer runs a 6D constant-velocity Kalman filter per tracklet,
  # predicts forward on frames with no association (coasting), and only
  # publishes tracks that survived M-of-N confirmation.
  tracker:
    # Drop a coasting tracklet after this many consecutive missed
    # associations. At ~13 Hz radar rate, 30 frames ≈ 2.3 s — enough
    # to bridge a vehicle passing behind a tree / sign and still hold
    # the ID for re-association. Combined with coast_vel_halflife_s
    # damping below, a longer coast budget doesn't cause predictions
    # to fly off into clutter.
    coast_max_frames: 30
    # Velocity half-life during coast (seconds). A coasting Kalman
    # track normally holds its last-measured velocity forever, so if
    # the target slows or stops while invisible, the KF prediction
    # overshoots and the reacquired cluster lands outside the gate →
    # new ID. Decaying velocity toward 0 keeps the prediction near
    # "where the target probably still is".
    coast_vel_halflife_s: 1.0
    # New tracks must hit this many times in the last `confirm_window`
    # frames before they're published to the GUI. Kills single-frame
    # false positives that would otherwise flash as boxes.
    confirm_min_hits: 2
    confirm_window: 3
    # Nearest-neighbour gate for cluster → tracklet association at dt=0
    # (fresh hit). Gate grows by `gate_growth_m_per_s` per second since
    # the last measurement, so coasting tracks keep a wider catch radius.
    assoc_gate_m: 5.0
    gate_growth_m_per_s: 2.0
    # Absorb-orphan radius. When DBSCAN fragments a single long object
    # (vehicle, wall) into two clusters, the second cluster can't claim
    # the first's track (one-track-per-frame rule) and would otherwise
    # spawn a phantom ID beside the real one. If its centroid sits
    # within this many metres of an already-matched track, we drop it
    # as a split sibling instead. Raise if you see twin IDs on big
    # targets; lower if adjacent objects are being incorrectly merged.
    merge_overlap_m: 5.0
    # Process-noise RMS acceleration for the CV model. Higher = track
    # reacts faster but jitters more; lower = smoother but lags maneuvers.
    # 3.0 is tuned for humans that pivot sharply — a pedestrian changing
    # direction had the KF velocity lag badly at 2.0 and the reacquired
    # cluster landed outside the gate, causing ID churn.
    q_accel_mps2: 3.0
    # Measurement-noise std on position. DBSCAN centroids jitter
    # ~10-20 cm frame-to-frame — 0.4 m is a realistic conservative value.
    r_pos_m: 0.4
    # Track graveyard — when a tracklet is reaped (coast budget exceeded)
    # its last state is stashed for graveyard_ttl_s. If a new cluster
    # appears within resurrect_radius_m of a graveyard entry, we reuse
    # the old ID instead of minting a new one. Fixes "ID churn" where a
    # target that briefly disappears (occlusion, sharp pivot, human
    # changing direction) comes back with a fresh ID.
    graveyard_ttl_s: 4.0
    resurrect_radius_m: 12.0

fusion:
  # Cross-sensor fusion (Ticket 5). Reads Thermal + EO (+ Radar when
  # it arrives) from the bus and emits global-ID tracks in angular
  # space. EO is the primary sensor (its angles are trusted when
  # both EO and Thermal see the same target). The GUI re-projects
  # each fused track into every panel's pixel grid so the bbox is
  # "the same bbox" across sensors.
  enabled: true
  rate_hz: 15                   # fusion tick rate (independent of sensors)
  match_gate_deg: 0.7           # cross-sensor: max angular distance (deg) to fuse
  track_match_gate_deg: 2.0     # per-tick: max angular distance to match existing track
                                # (cameras are coplanar <5cm apart so parallax ~= 0°;
                                #  looser gate prevents small bbox jitter spawning dup IDs)
  min_hits: 1                   # ticks before a track is visible in the GUI
  # Extended 2026-04-27 from 15→30 (~2.0s @ 15Hz). Replay analysis of
  # the 5 human-tracking attempts showed every fused track was EO-only
  # (no thermal h/v support on this rig at present), and YOLO loses
  # the person briefly during fast gimbal slews. With max_misses=15
  # the track id died after ~1s of YOLO drop and the user's TRACK
  # lock grace-expired soon after. With 30 the angular position
  # survives long enough for YOLO to re-acquire on the same target,
  # keeping the same fused-track id and the user's lock alive.
  # Coupled with the predictor's new no_obs_lead_zero_after_s=0.3,
  # the gimbal holds last-observed position cleanly during the
  # extended grace window — no runaway, just a pause.
  max_misses: 30
                                # (~1s at 15Hz). ByteTrack (per-sensor) already
                                # coasts through brief dropouts via Kalman, so
                                # fusion's grace can stay short.
  # Phase 2 — radar as third late-fusion sensor.
  # Radar bboxes are derived from 3D cluster size projected at slant
  # range, so they're coarser than EO/thermal pixel-detector boxes.
  # A more permissive IoU gate keeps radar associating with EO/thermal
  # tracks even when its bbox barely brushes the camera box.
  radar_iou_gate: 0.05          # cross-sensor IoU floor for radar↔(eo|thermal)

gimbal:
  # Pan/tilt via Pololu Micro Maestro 6-Channel (Ticket 4).
  # Port is auto-detected via USB VID=0x1FFB, BUT: in "USB Dual Port"
  # serial mode the Maestro exposes TWO COM ports (Command + TTL), and
  # on this laptop Windows shows them both as plain "USB Serial Device"
  # with no "Command Port" suffix — so auto-detect can pick the wrong
  # one and every write silently no-ops (or errors with PermissionError
  # 13). COM4 was verified as the Command Port via `scripts/gimbal_probe
  # --sweep`. Leave this pinned; run the probe again if ports shuffle.
  enabled: true
  port: COM4                    # Command Port (COM5 on this box is TTL)
  rate_hz: 60                   # command/publish loop rate

  # Home / rest pose. tilt convention: 0 = horizon, higher = more up.
  # Operator-measured tilt envelope on this rig (2026-04-25, second
  # cal) is 0..90° — see tilt_calibration block below. Pan envelope
  # is ±45°.
  home_pan_deg: 0.0
  # Home sits at horizon (tilt 0°) — operator preference 2026-04-25.
  # With absolute-angle sliders, dragging from horizon to wherever
  # the scene needs is one gesture, so there's no "needs head-room"
  # argument for parking elsewhere.
  home_tilt_deg: 0.0

  # Are the cameras rigidly mounted on the gimbal, or stationary next
  # to it on the bench?
  #
  # false (bench / current setup): cameras on tripod, gimbal is its own
  #   rig. Fused az/el is an absolute bench-frame bearing, so the gimbal
  #   commands `pan = home_pan + az`, `tilt = home_tilt + el`. Flipping
  #   this from true→false is what stopped the gimbal from slewing into
  #   its limits on every TRACK press.
  #
  # true (flight / real mission): cameras rotate with the gimbal, az/el
  #   is measured off-boresight and shrinks to zero as the gimbal
  #   centers the target, so the command integrates: `pan += az`.
  cameras_on_gimbal: true

  # Auto-track control law tuning. The defaults inside gimbal_manager
  # were picked for distant targets where centroid jitter is large
  # and a wide deadband prevents twitchy hunting. Close foreground
  # targets (e.g. a vehicle filling 30% of the EO frame) typically
  # land inside that deadband while still visibly off-center, which
  # looks like "track does nothing" to the operator. Lower defaults
  # below trade a bit more residual servo activity for visibly
  # responsive tracking on close targets.
  kp_track:    0.30           # was 0.15 — faster slew toward target
  deadband_deg: 0.6           # was 2.5  — tighter centering tolerance
  max_step_deg: 2.0           # per-tick setpoint cap (unchanged)

  # Alpha-beta predictor knobs (algorithms/track_predictor.py).
  # Defaults are baked into PredictorParams; override here per rig.
  track_lead_time_s: 0.30
  track_vel_alpha: 0.30
  track_predict_warmup_n: 5
  track_predict_cap_deg: 5.0
  track_gimbal_settled_dps: 15.0
  track_extrap_horizon_s: 2.0
  # Tightened 2026-04-26 (was 60). A single fresh observation arriving
  # on a brief settle between fast slews used to produce a 49 dps
  # raw_dot that smoothed into +17 dps and pushed the setpoint past
  # the cap → gimbal hunted blindly until grace. 30 dps is well above
  # legitimate target rate at our ranges, well below the latency
  # spike envelope.
  track_vel_clip_dps: 30.0
  # New 2026-04-26. When fresh observations stop, decay world_*_dot
  # toward 0 with this half-life so the predictor doesn't coast on a
  # stale velocity spike. Set 0 to disable (legacy behaviour).
  track_vel_decay_halflife_s: 0.20
  # New 2026-04-27. After this age-since-fresh-obs, the predictor's
  # lead-time extrapolation is hard-zeroed. Replay confirmed that
  # decay alone leaves residual hunting (~3° amplitude shrinking
  # over 1+ s); zeroing lead at 0.3 s collapses the hunt immediately
  # while still allowing 0.3 s of lead-aided convergence on a
  # genuinely fresh track.
  track_no_obs_lead_zero_after_s: 0.30

  # ── Optical residual correction (Stage A diagnostic + Stage B closed-loop)
  #
  # Stage A is always on: when a synthetic-target lock is active, the
  # gimbal manager runs LK optical flow on EO + thermal frames against
  # an anchor captured at lock time. The measured pixel displacement,
  # converted via the recorded FOV, gives the actual angular movement
  # the camera made (since hobby servos have no position feedback). The
  # difference vs the controller's commanded delta is the visual
  # residual — emitted as the `optical_residual` event so we can A/B
  # closed-loop work via replay tools.
  #
  # Stage B (gated by `optical_correction_enabled` below) feeds that
  # residual into an integrator that biases the synth-target world-
  # frame setpoint, closing the loop visually. Enable to A/B against
  # the open-loop baseline. Disable while debugging Stage A.
  optical_correction_enabled: true       # ON for A/B test (will revert)
  optical_correction_alpha: 0.2          # integrator gain per residual sample
  optical_correction_max_deg: 5.0        # anti-windup cap on cumulative bias
  optical_correction_min_features: 12    # below this, skip update (LK noisy)
  optical_correction_warmup_s: 1.0       # ignore residual for first N s
                                         # post-lock (synth slew still running)
  optical_correction_step_max_deg: 0.3   # per-tick cap on integrator change
                                         # so the synth-OF tracker can follow
  optical_correction_settled_deg: 0.7    # only update when |cur - cmd| < this
                                         # (gimbal has reached current target)

  # Software safety envelope & slew rate.
  #
  # Operator-measured mechanical envelope (2026-04-25, second cal):
  #   PAN   ch 0: 1950 µs = -45° (max LEFT),  1250 µs = +45° (max RIGHT)
  #               (reduced from ±90° to ±45° to keep the camera mount
  #                inside its safe travel — cables don't bind in this
  #                range and the field of regard is still ample.)
  #   TILT  ch 1: 1030 µs = 0° (horizon, exact),
  #               2000 µs = 90° (vertical up, exact)
  #               (tilt floor lowered from 3° to 0° — operator now
  #                wants the gimbal to be able to look straight at
  #                ground-level / horizon-level targets.)
  limits:
    pan_min_deg: -45.0
    pan_max_deg:  45.0
    tilt_min_deg:  0.0
    tilt_max_deg: 90.0
    pan_slew_deg_per_s:  120.0
    tilt_slew_deg_per_s:  60.0

  # Linear angle→µs calibration per servo.
  # Values reflect the actual mechanical/electrical envelope of THIS
  # rig as measured by the operator in Maestro Control Center.
  pan_calibration:
    channel: 0
    min_deg: -45.0
    max_deg:  45.0
    # With invert=true the controller maps:
    #   -45° (LEFT)   → us_at_max_deg = 1950 µs
    #   +45° (RIGHT)  → us_at_min_deg = 1250 µs
    # i.e. LOWER pulse = MORE RIGHT pan. Direction-tested with
    # operator: ◄ moves left, ► moves right. Same polarity as the
    # earlier ±90° calibration — only the µs endpoints shifted.
    us_at_min_deg: 1250.0
    us_at_max_deg: 1950.0
    invert: true        # servo mounted so +pan (right) needs lower pulse
  tilt_calibration:
    channel: 1
    min_deg:  0.0
    max_deg: 90.0
    # 2026-04-25 operator-measured envelope (second cal):
    #   1030 µs = 0°  (horizon, exact)
    #   2000 µs = 90° (vertical up, exact)
    # With invert=false the controller maps DIRECTLY:
    #   0°  → us_at_min_deg = 1030 µs
    #   90° → us_at_max_deg = 2000 µs
    # i.e. HIGHER pulse = HIGHER tilt. Pressing ▲ (UP) drives the
    # gimbal physically up. If after a mechanical mount change this
    # is reversed, flip invert to true and leave the µs values alone.
    us_at_min_deg: 1030.0
    us_at_max_deg: 2000.0
    invert: false

gui:
  host: 127.0.0.1
  port: 8080
  open_browser: true
  ws_fps: 60                    # GUI push rate; actual fps is min(ws_fps, camera_fps, encode_budget)
  thermal_jpeg_quality: 80      # 8-bit colormapped thermal looks fine at 80.
                                # (Briefly bumped to 92 on 2026-04-27; full
                                # revert to original on operator request when
                                # the visible image looked worse than the
                                # baseline despite the bigger files.)
  eo_jpeg_quality:     82       # Was 95 — dropped 2026-04-25 to free encode
                                # budget. The shared WS broadcast loop was
                                # CPU-bound at ~12 Hz with q=95; q=82 cuts
                                # JPEG size ~40% and encode time ~25% with
                                # near-invisible loss on mono. Result: WS
                                # broadcasts at ~18-20 Hz, freeing thermal
                                # to display at higher cadence too.
                                # Raise back to 92-95 if you specifically
                                # need foliage/brick/chain-link fidelity
                                # at the cost of motion smoothness.

recording:
  enabled: true                 # Master kill switch. False = REC button is a no-op.
  auto_start: false             # If true, begin recording at app launch.
                                # Overridden at the CLI by `python main.py --auto-record`.
  output_dir: ./recordings      # JSONL files land here as seeker_YYYY-MM-DD_HH-MM-SS.jsonl
  jpeg_quality: 92              # Recording fidelity is decoupled from the wire (see
                                # gui.eo_jpeg_quality). 92 = near-lossless, ~3-5 ms encode
                                # per 640×512 frame. Drop to 85 if recordings stutter.
  channels:                     # Per-channel enables. Set false to skip on disk.
    thermal/frame: true
    eo/frame: true
    radar/frame: true
    gimbal/state: true
    fusion/tracks: true
    events: true                # always-on in practice (no separate thread)

logging:
  level: INFO
  log_dir: ./logs
  max_bytes: 5242880
  backup_count: 3
