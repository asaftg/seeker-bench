% PMM single-TX config — propeller micro-Doppler detection.
%
% Waveform: single transmitter, slope=4.5 MHz/us, N=192, max_range=500m.
%
% Why single-TX (CRITICAL — see 2026-05-17 analysis):
%  - DDM mode is EMPIRICALLY UNVIABLE for PMM. Measured: propeller tone
%    at only +4.9 dB at 3.5m with idle throttle. DDM TX switching creates
%    artifacts at PRF/6, PRF/3, PRF/2 (+34-46 dB) that overwhelm the
%    real signal. Slot-0 decimation removes artifacts but also 5/6 data.
%  - Single-TX: all 768 chirps are coherent slow-time samples at the full
%    ~30478 Hz PRF -> Nyquist ~15 kHz. No DDM artifacts. Full propeller
%    signature visible without any decimation penalty.
%
% Why slope=4.5 (not 8.883):
%  - max_range = Fs*c/(4*slope) = 30e6*3e8/(4*4.5e12) = 500 m
%  - Shahed detection at 400-500m requires this range ceiling.
%  - No SNR penalty (noise/bin depends on N and Fs, not slope).
%  - Cost: range_res 2.64m -> 5.21m (acceptable — drone in sky has
%    nothing else within 5m at its range).
%
% Physics:
%   R_max = 500 m
%   BW    = 4.5 * (192/30) = 28.8 MHz
%   dr    = c/(2*BW) = 5.21 m  (96 range bins)
%   PRF   = 30478 Hz (single-TX, all chirps)
%   Nyquist = 15239 Hz (covers all blade harmonics)
%   Processing gain = 10*log10(192) = 22.8 dB
%   Dwell = 768 chirps * 32.81 us = 25.2 ms -> 20 Hz frame rate
%
% Changes vs unified.cfg:
%   channelCfg  txMask 15 -> 1      (TX0 only)
%   chirpCfg    0 0 (single index) txEnable 1  (TX0 only, 1 chirp type)
%   frameCfg    0 0 768            (1 index x 768 loops = 768 chirps)
%   profileCfg  slope 8.883 -> 4.5  (500m range)
%   ddmPhaseShiftAntOrder           REMOVED (no DDMA)
%
% CRITICAL: frameCfg uses chirp index 0 only (1 type x 768 loops).
% This makes the pipeline parser set n_tx_slots=1, so no slot-0
% decimation is applied — all 768 chirps feed directly into PMM.
%
% REQUIRES: firmware LVDS fix for single-TX (mmw_demoDDM doesn't stream
% LVDS in single-TX mode without the firmware patch). Until then, use
% the DDMA unified.cfg with slot-0 decimation for PMM.
%
% TEST CHECKLIST:
%  1. cfg push ends with "Done" (no rejected lines)
%  2. raw-ADC streams: DataPortListener drops_seq=0
%  3. Recording produces _radar.bin with correct frame size:
%     768 chirps * 4 RX * 192 samples * 2 bytes = 1,179,648 bytes/frame
sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 15 0 0 0
adcCfg 2 0
adcbufCfg -1 1 0 0 1
lowPower 0 0
profileCfg 0 77 12 7 20.81 0 0 4.5 0 192 30000 0 0 164
chirpCfg 0 0 0 0 0 0 0 1
frameCfg 0 0 768 0 192 50 1 0
guiMonitor -1 1 1 0 0 0 1
cfarCfg -1 1 3 16 0 0 1 26.0 1 7 0 1 0
cfarCfg -1 0 3 16 0 0 0 15.0 0 7 0 0
compressionCfg -1 1 1 0.5 8
intfMitigCfg -1 15 18
localMaxCfg -1 3 40
antGeometryCfg 1 0 1 1 1 2 1 3 0 2 0 3 0 4 0 5 1 4 1 5 1 6 1 7 1 8 1 9 1 10 1 11 0.5 0.8
antennaCalibParams 0.00000 -0.29694 -0.38086 -0.26746 -0.46326 -0.31146 -0.43408 0.21661 -0.57410 -0.38519 -0.33844 -0.37524 -0.43256 -0.40015 -0.39343 0.30347 -0.77173 -0.44043 -0.31732 -0.43945 -0.41565 -0.45862 -0.37561 0.45654 -0.88971 -0.39307 -0.32764 -0.39508 -0.42010 -0.39899 -0.39032 0.31293
measureRangeBiasAndRxChanPhase 0 1.5 0.2
analogMonitor 0 0
calibData 0 0 0x1f0000
aoaFovCfg -1 -90 90 -90 90
lvdsStreamCfg -1 0 1 0
sensorStart
