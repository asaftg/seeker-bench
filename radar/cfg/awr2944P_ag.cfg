% A/G long-range chirp — pushed when the operator selects A/G mode.
%
% Goal: detect ground vehicles to 500m and humans to ~300m while keeping
% the same 20 Hz frame rate and matching Stock's range resolution.
%
% Key changes from awr2944P_unified.cfg (Stock):
%   slope:         8.883 → 4.5 MHz/µs   (halved → doubles R_max)
%   numAdcSamples:   192 → 384           (doubled → recovers range res)
%   rampEndTime:   20.81 → 27.5 µs       (accommodates longer ADC window)
%   lvdsStreamCfg: DISABLED              (384 samples triggers the LVDS
%                                         DMA halt bug; A/G only needs
%                                         the TLV point cloud)
%
% Physics:
%   R_max = c·Fs / (4·S) = 3e8 · 30e6 / (4 · 4.5e12) = 500 m
%   BW    = S · (N/Fs) = 4.5 · (384/30) = 57.6 MHz
%   Δr    = c / (2·BW) = 3e8 / (2·57.6e6) = 2.60 m
%
% Frame rate: chirp time = idle(12) + ramp(27.5) = 39.5 µs
%   6 chirps × 128 loops = 768 chirps → 30.3 ms active → 20 Hz OK.
%
% LVDS is OFF so A/A mode is unavailable while in A/G. Switching back
% to Stock re-pushes the unified cfg which re-enables LVDS.
sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 15 0 0 0
adcCfg 2 0
adcbufCfg -1 1 0 0 1
lowPower 0 0
profileCfg 0 77 12 7 27.5 0 0 4.5 0 384 30000 0 0 164
chirpCfg 0 5 0 0 0 0 0 15
frameCfg 0 5 128 0 192 50 1 0
guiMonitor -1 1 1 0 0 0 1
% CFAR thresholds — same as Stock for now. The longer-range profile
% has ~3 dB higher noise floor (2× ADC samples → 2× noise bandwidth)
% but the on-chip CFAR is adaptive so the fixed threshold still works.
% If we see too many false alarms at 300-500m, raise range CFAR from
% 26 → 28 dB. If we miss weak targets, lower to 24.
cfarCfg -1 1 3 16 0 0 20.0 26.0 1 7 0 1 0
cfarCfg -1 0 3 16 0 0 0 15.0 0 7 0 0
compressionCfg -1 1 1 0.5 8
intfMitigCfg -1 15 18
localMaxCfg -1 3 40
ddmPhaseShiftAntOrder 0 2 3 1
antGeometryCfg 1 0 1 1 1 2 1 3 0 2 0 3 0 4 0 5 1 4 1 5 1 6 1 7 1 8 1 9 1 10 1 11 0.5 0.8
antennaCalibParams 0.00000 -0.29694 -0.38086 -0.26746 -0.46326 -0.31146 -0.43408 0.21661 -0.57410 -0.38519 -0.33844 -0.37524 -0.43256 -0.40015 -0.39343 0.30347 -0.77173 -0.44043 -0.31732 -0.43945 -0.41565 -0.45862 -0.37561 0.45654 -0.88971 -0.39307 -0.32764 -0.39508 -0.42010 -0.39899 -0.39032 0.31293
measureRangeBiasAndRxChanPhase 0 1.5 0.2
analogMonitor 0 0
calibData 0 0 0x1f0000
aoaFovCfg -1 -90 90 -90 90
% LVDS streaming DISABLED.
% numAdcSamples=384 triggers the LVDS DMA halt that limits bursts
% to 5s (MMWSDK-2560). A/G only uses the TLV point cloud — raw ADC
% is not needed. When the operator switches back to Stock, the
% unified cfg re-enables LVDS for A/A mode.
lvdsStreamCfg -1 0 0 0
sensorStart
