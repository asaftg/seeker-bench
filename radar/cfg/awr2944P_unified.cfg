% Unified Phase-3 cfg — pushed to the chip ONCE at Seeker startup.
%
% Identical to awr2944P_stock.cfg byte-for-byte EXCEPT for one added
% line: lvdsStreamCfg -1 0 1 0 (raw-ADC LVDS streaming alongside the
% TLV path). With this cfg, the chip emits BOTH:
%   - TLV point cloud / objects on COM10 UART       (existing path,
%                                                    consumed by
%                                                    radar.RadarManager
%                                                    in stock + AG modes)
%   - raw ADC over LVDS to DCA1000 → UDP 4098/host  (new path, consumed
%                                                    by radar_dca.DCAPipeline
%                                                    in AA mode)
%
% Both data planes flow continuously. Mode dispatch (stock / AG / AA)
% is purely host-side: which pipeline's RadarFrame the GUI displays.
% Switching modes does NOT push a new cfg, does NOT power-cycle the
% chip, does NOT pause streaming.
%
% Validated 2026-04-29 10:34 — see commit "Phase 3 step 7".
sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 15 0 0 0
adcCfg 2 0
adcbufCfg -1 1 0 0 1
lowPower 0 0
% idleTime 7→12 µs: TI mmwave SDK 4.6.1.2 Release Notes Limitation #3 —
% "LVDS transfer needs longer chirp idle time" workaround for the
% LVDS-vs-Ethernet rate mismatch that triggers MMWSDK-2560.
profileCfg 0 77 12 7 20.81 0 0 8.883 0 384 30000 0 0 164
chirpCfg 0 5 0 0 0 0 0 15
frameCfg 0 5 128 0 384 50 1 0
guiMonitor -1 2 1 0 0 0 1
cfarCfg -1 1 3 16 0 0 1 26.0 1 7 0 1 0
cfarCfg -1 0 3 16 0 0 0 15.0 0 7 0 0
% compressionMethod 0→1 (BFP, Block Floating Point) — TI's reference
% _bfpCmp profile uses method=1; method=0 in our prior cfg was the
% un-validated default and may contribute to the LVDS DMA halt.
compressionCfg -1 1 1 0.5 8
intfMitigCfg -1 15 18
localMaxCfg -1 3 40
ddmPhaseShiftAntOrder 0 2 3 1
antGeometryCfg 1 0 1 1 1 2 1 3 0 2 0 3 0 4 0 5 1 4 1 5 1 6 1 7 1 8 1 9 1 10 1 11 0.5 0.8
antennaCalibParams 0.00000 -0.29694 -0.38086 -0.26746 -0.46326 -0.31146 -0.43408 0.21661 -0.57410 -0.38519 -0.33844 -0.37524 -0.43256 -0.40015 -0.39343 0.30347 -0.77173 -0.44043 -0.31732 -0.43945 -0.41565 -0.45862 -0.37561 0.45654 -0.88971 -0.39307 -0.32764 -0.39508 -0.42010 -0.39899 -0.39032 0.31293
measureRangeBiasAndRxChanPhase 0 1.5 0.2
analogMonitor 0 0
calibData 0 0 0x1f0000
aoaFovCfg -1 -90 90 -90 90
% Raw-ADC LVDS streaming.
%   enableHeader = 0 (HW-only ADC, no HSI header — required for raw
%                     ADC mode per mmw_demoDDM mss_main.c:419)
%   dataFmt      = 1 (ADC samples)
%   enableSW     = 1 (CRITICAL — see below)
%
% enableSW=1 is the firmware-bug fix for the LVDS halt-after-burst
% issue (mmw_demoDDM 4.7.2.1, AWR2944P). With enableSW=0 in single-
% subframe HW-only mode, the CBUFF session is implicitly deactivated
% after the first frame and the chip never re-activates it (see
% mmw_lvds_stream.c:609-645). With enableSW=1, the SW frame-done
% callback at mss_main.c:685 calls CBUFF_activateSession on the HW
% handle every frame — continuous ping-pong, never halts.
%
% Side effect: the chip emits a small SW-lane stream of point-cloud
% metadata in addition to raw ADC. The DCA1000 forwards both; our
% pipeline only consumes the HW-lane bytes (raw ADC) so the SW
% bytes are discarded harmlessly.
lvdsStreamCfg -1 0 1 1
sensorStart
