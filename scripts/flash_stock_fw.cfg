# Seeker — flash STOCK mmw_demoDDM (rollback if patched FW misbehaves)
#
# Use this if the patched firmware is broken. Same command,
# different appimage. Restores chip to TI's pristine 4.7.2.1 build.
#
# Prereq: EVM in UART boot mode + 12V power-cycle (same as flash_patched_fw.cfg)
#
# Invocation:
#   python C:/ti/mcu_plus_sdk_awr2x44p_10_02_00_04/tools/boot/uart_uniflash.py \
#          --serial-port COM11 --cfg scripts/flash_stock_fw.cfg

--flash-writer=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_uart_uniflash.release.tiimage
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr294x/mmw/awr2944_mmw_demoDDM.appimage.STOCK_BACKUP --operation=flash --flash-offset=0xA0000
