# Seeker DIAGNOSTIC firmware — adds UART print "[SEEKER] HW frame N"
# every time the chip's LVDS HW frame-done IRQ fires. When streaming
# halts tomorrow, we'll see in the UART log the LAST frame-done that
# fired before the halt — that's the smoking gun for what causes
# the halt.
#
# Built for the AWR2X44P target (right chip variant, awr2x44P-native
# source path), not the awr2944 target like all earlier attempts.
#
# Patch: 1 line added in MmwDemo_LVDSStream_HwTriggerFrameDone in
# C:/ti/.../awr2x44P/mmw_ddm/mss/mmw_lvds_stream.c
#   if (hwFrameDoneCount <= 1000) {
#       test_print("[SEEKER] HW frame %u\n", hwFrameDoneCount);
#   }

--flash-writer=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_uart_uniflash.release.tiimage
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr2x44P/mmw_ddm/awr2x44P_mmw_demoDDM.appimage.SEEKER_DEBUG --operation=flash --flash-offset=0xA0000
