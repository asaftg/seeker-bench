# Seeker PATCHED_v3 firmware — calibration disable + BSS event logging
# + periodic CBUFF cycle every 100 frames.
#
# Patches over PATCHED_v2:
#   1. mss_main.c MmwDemo_eventCallbackFxn — CLI_write every BSS async
#      event so we see exactly which event fires before halt.
#      Watch for: BSSEV !! FRAME_END (BSS auto-stop), BSSEV
#      MON_TIMING_FAIL n=N (monitoring overrun), BSSEV !! RF_ANALOG_FAULT
#      (APLL/SYNTH unlock), BSSEV !! RF_CPUFAULT/ESMFAULT (BSS exception).
#   2. mmw_lvds_stream.c MmwDemo_LVDSStream_PeriodicCycle — every 100
#      frames (5 sec), do CBUFF_deactivateSession + CBUFF_activateSession.
#      Hypothesis: replicates what host's cfg-re-push auto-kick does
#      manually, but in microseconds instead of 5+ sec stall+recovery.
#      Empirical evidence: cfg re-push WORKS to recover halted chip.
#   3. mss_main.c MMWDEMO_DPC_RESULT — call PeriodicCycle each frame.
#
