# Seeker PATCHED_v2 firmware — disables periodic RF calibration that was
# interrupting continuous LVDS streaming.
#
# Background: SEEKER_DEBUG firmware (yesterday) gave 35-37 sec of clean
# 242 MB streaming, then halted. Three parallel agents converged on the
# root cause:
#   - Agent 2 (CBUFF/EDMA source): inconclusive on hardware counter
#     exhaustion, unlikely given byte-vs-time math.
#   - Agent A (calibration timer): mss_main.c line 2930 ships
#     `enablePeriodicity = true` with periodicTimeInFrames=10. With
#     50 ms framePeriodicity that's RF re-calibration every 500 ms,
#     accumulating ~70 calibrations by the 35 sec halt mark.
#     Each calibration takes the RF frontend offline; cumulative BSS
#     state corruption is the documented failure mode in TI examples
#     that disable periodicity for continuous streaming.
#   - Agent C (web research): also flagged numFrames=0 (infinite frames)
#     as having documented edge-case bugs across SDK versions; that fix
#     lives in awr2944P_unified.cfg (numFrames 0 → 65535).
#
# Patch applied: mss_main.c L2930
#   - calibrationCfg.u.chirpCalibrationCfg.enablePeriodicity = true;
#   + calibrationCfg.u.chirpCalibrationCfg.enablePeriodicity = false;
#
# Built 2026-05-01 09:02 — same chip variant + ordering as SEEKER_DEBUG:
# devID=55, MSS@0 M4@2 DSS@1 RadarSS@3.

--flash-writer=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_uart_uniflash.release.tiimage
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr2x44P/mmw_ddm/awr2x44P_mmw_demoDDM.appimage.PATCHED_v2 --operation=flash --flash-offset=0xA0000
