# Ticket 5a — AWR2944P flash config for MCU+ SDK v10 uart_uniflash.py
#
# Invocation:
#   python C:/ti/mcu_plus_sdk_awr2x44p_10_02_00_04/tools/boot/uart_uniflash.py \
#          --serial-port COM<SBL_UART> --cfg scripts/flash_awr2944p.cfg
#
# Prereqs on EVM: SOP5 (flash mode) — J17 closed, J18 open, J20 closed, NRESET tapped.
# Prereqs on host: pip install pyserial tqdm xmodem
#
# Paths MUST use forward slashes — uart_uniflash.py parses via shlex(posix=True)
# which would otherwise treat '\' as an escape character and mangle 'C:\ti\...'.

# Step 1: ROM downloads this UART flashwriter into RAM and runs it.
--flash-writer=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_uart_uniflash.release.tiimage

# Step 2: flash the QSPI SBL at offset 0x0 (ROM jumps here on next boot).
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0

# Step 3: flash the mmw_demoDDM application at 0xA0000 (SBL jumps here).
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr2x44P/mmw_ddm/awr2x44P_mmw_demoDDM.appimage --operation=flash --flash-offset=0xA0000
