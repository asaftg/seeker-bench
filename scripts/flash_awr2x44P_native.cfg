# Flash AWR2X44P-NATIVE TI prebuilt firmware (NOT awr2944 variant).
#
# Discovery 2026-04-30 22:xx: TI ships two mmw_demoDDM appimages —
#   awr2944_mmw_demoDDM.appimage    — for AWR2944 (no P)
#   awr2x44P_mmw_demoDDM.appimage   — for AWR2X44P (our chip)
# We've been flashing the wrong variant for months. The chip's CLI banner
# reports "AWR2X44P MMW Demo 04.07.02.01" so it's clearly P-class silicon.
# Trying the proper P-variant build to see if (a) it boots clean,
# (b) the LVDS halt bug is absent.

--flash-writer=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_uart_uniflash.release.tiimage
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr2x44P/mmw_ddm/awr2x44P_mmw_demoDDM.appimage --operation=flash --flash-offset=0xA0000
