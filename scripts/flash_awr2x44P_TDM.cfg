# Flash AWR2X44P-NATIVE TDM variant (last quick experiment).
# DDM has a confirmed LVDS halt bug across both awr2944 and awr2x44P-native
# stock builds (~5-30s burst then halt). TDM uses sequential TX antennas,
# different LVDS bandwidth profile — might bypass the bug.

--flash-writer=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_uart_uniflash.release.tiimage
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr2x44P/mmw_tdm/awr2x44P_mmw_demoTDM.appimage --operation=flash --flash-offset=0xA0000
