# Seeker — flash PATCHED mmw_demoDDM (LVDS continuous-streaming fix)
#
# Patch (mmw_lvds_stream.c::MmwDemo_LVDSStream_HwTriggerFrameDone):
#   Adds CBUFF_deactivateSession + CBUFF_activateSession in the
#   single-subframe HW-only branch (numSubFrames==1, isSwEnabled==0)
#   so the chip's LVDS DMA is re-armed on every frame-done IRQ.
#   Without this branch the original firmware halts streaming after
#   the first frame burst.
#
# Prereq: EVM in UART boot mode (J17 closed + J20 closed = SOP[2:0]=101)
#         then 12V power-cycle so chip lands in ROM bootloader.
#
# Invocation:
#   python C:/ti/mcu_plus_sdk_awr2x44p_10_02_00_04/tools/boot/uart_uniflash.py \
#          --serial-port COM11 --cfg scripts/flash_patched_fw.cfg

# 1) ROM downloads sbl_uart_uniflash.tiimage into RAM and runs it.
--flash-writer=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_uart_uniflash.release.tiimage

# 2) Re-flash the QSPI SBL at offset 0x0 (defensive — same as stock,
#    overwriting with identical content is harmless if it's already there).
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/tools/awr2x44P/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0

# 3) Flash the PATCHED mmw_demoDDM at 0xA0000.
--file=C:/ti/mmwave_mcuplus_sdk_04_07_02_01/ti/demo/awr294x/mmw/awr2944_mmw_demoDDM.appimage.PATCHED --operation=flash --flash-offset=0xA0000
