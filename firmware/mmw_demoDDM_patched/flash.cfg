# Patched mmw_demoDDM flash config (Seeker fork).
# Same SBL + sbl_qspi as the mmw_studio_cli flash. Only the appimage line
# differs: this points to firmware/mmw_demoDDM_patched/awr2x44P_mmw_demoDDM.appimage,
# which packs MSS (with 5 SEEKER patches) + DSS_CM4 + DSS + RadarSS firmware.
# Patches restore the on-chip CFAR/clustering/TLV path that mmw_studio_cli stripped.

# 1. The flash-writer SBL is loaded by the chip's ROM bootloader and acts as a server
--flash-writer=C:/ti/mcu_plus_sdk_awr2x44p_10_02_00_04/examples/drivers/boot/sbl_uart_uniflash/awr2x44p-evm/r5fss0-0_nortos/ti-arm-clang/sbl_uart_uniflash.release.tiimage

# 2. Flash sbl_qspi at offset 0x0. ROM will boot this from QSPI on Functional mode
--file=C:/ti/mcu_plus_sdk_awr2x44p_10_02_00_04/examples/drivers/boot/sbl_qspi/awr2x44p-evm/r5fss0-0_nortos/ti-arm-clang/sbl_qspi.release.tiimage --operation=flash --flash-offset=0x0

# 3. Flash the patched mmw_demoDDM appimage at offset 0xA0000. sbl_qspi loads from this offset.
--file=C:/Users/asaf.ruf.BLUERIVERTECH/Desktop/Seeker01/seeker_bench/firmware/mmw_demoDDM_patched/awr2x44P_mmw_demoDDM.appimage --operation=flash --flash-offset=0xA0000
